<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda OS Pro | Premium Management</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #050507;
            --surface: #101014;
            --accent: #00f2ff;
            --danger: #ff3366;
            --success: #00ff88;
            --glass: rgba(255, 255, 255, 0.03);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }

        body {
            background-color: var(--bg);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
            background-image: radial-gradient(circle at 50% -20%, #1a1a2e, #050507);
        }

        .container { max-width: 1300px; margin: 0 auto; }

        /* Header Premium */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            margin-bottom: 40px;
        }

        .logo-area h1 { font-size: 1.8rem; font-weight: 700; letter-spacing: -1px; background: linear-gradient(to right, #fff, var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        #relogio { font-size: 1.2rem; font-weight: 300; color: var(--accent); text-shadow: 0 0 15px rgba(0,242,255,0.3); }

        /* Barra de Comando */
        .command-bar {
            background: var(--surface);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .command-bar input, .command-bar select {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 12px 20px;
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            transition: 0.3s;
        }

        .command-bar input:focus { border-color: var(--accent); outline: none; background: rgba(255,255,255,0.06); }

        .btn-add {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 0 30px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-add:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(0,242,255,0.2); }

        /* Grid Organizável */
        .agenda-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
        }

        .card-pro {
            background: var(--surface);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 24px;
            padding: 24px;
            position: relative;
            cursor: grab;
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            overflow: hidden;
        }

        .card-pro:active { cursor: grabbing; }

        .card-pro.locked { border-color: rgba(255,255,255,0.2); opacity: 0.9; cursor: default; }
        .card-pro.locked .editable { pointer-events: none; }

        .card-tag {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .card-pro h3 { font-size: 1.3rem; margin-bottom: 10px; color: #fff; }
        .card-pro p { color: #888; font-size: 0.95rem; line-height: 1.5; margin-bottom: 20px; }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(255,255,255,0.05);
            padding-top: 15px;
        }

        .time-info { font-size: 0.85rem; color: var(--accent); }

        .actions { display: flex; gap: 12px; }
        .action-btn { background: none; border: none; color: #555; cursor: pointer; transition: 0.3s; font-size: 1.1rem; }
        .action-btn:hover { color: #fff; }
        .action-btn.del:hover { color: var(--danger); }
        .action-btn.active-lock { color: var(--accent); }

        /* Animação de Alerta */
        @keyframes pulse-alert {
            0% { box-shadow: 0 0 0 0 rgba(0, 242, 255, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(0, 242, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 242, 255, 0); }
        }
        .alert-imminent { animation: pulse-alert 2s infinite; border-color: var(--accent); }

        /* Notificação Toast */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--accent);
            color: #000;
            padding: 15px 40px;
            border-radius: 50px;
            font-weight: 700;
            display: none;
            z-index: 9999;
            box-shadow: 0 15px 30px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body ondrop="drop(event)" ondragover="allowDrop(event)">

    <div class="container">
        <header>
            <div class="logo-area">
                <h1>AGENDA PRO 2026</h1>
            </div>
            <div id="relogio">00:00:00</div>
        </header>

        <div class="command-bar">
            <input type="text" id="titleTask" placeholder="Título da demanda..." style="flex: 2;">
            <input type="datetime-local" id="dateTask">
            <select id="catTask">
                <option value="Trabalho">Trabalho</option>
                <option value="Pessoal">Pessoal</option>
                <option value="Urgente">Urgente</option>
            </select>
            <button class="btn-add" onclick="createTask()">ADICIONAR TASK</button>
        </div>

        <div class="agenda-grid" id="mainGrid">
            </div>
    </div>

    <div id="toast" class="toast">Notificação Pro</div>
    <audio id="alertSound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3"></audio>

    <script>
        let database = JSON.parse(localStorage.getItem('pro_agenda_db')) || [];
        let notifiedTasks = new Set();

        function createTask() {
            const title = document.getElementById('titleTask').value;
            const date = document.getElementById('dateTask').value;
            const category = document.getElementById('catTask').value;

            if (!title || !date) return notify("Preencha todos os campos!");

            const task = {
                id: 'id' + Date.now(),
                title,
                date,
                category,
                desc: 'Clique para detalhar...',
                locked: false,
                color: category === 'Urgente' ? 'var(--danger)' : 'var(--accent)'
            };

            database.push(task);
            saveAndRender();
            document.getElementById('titleTask').value = '';
        }

        function saveAndRender() {
            localStorage.setItem('pro_agenda_db', JSON.stringify(database));
            const grid = document.getElementById('mainGrid');
            grid.innerHTML = '';

            database.forEach((task, index) => {
                const imminent = checkImminent(task.date);
                const div = document.createElement('div');
                div.className = `card-pro ${task.locked ? 'locked' : ''} ${imminent ? 'alert-imminent' : ''}`;
                div.draggable = !task.locked;
                div.id = task.id;
                div.setAttribute('ondragstart', 'drag(event)');

                div.innerHTML = `
                    <div class="card-tag" style="background: ${task.color}22; color: ${task.color}">${task.category}</div>
                    <h3 contenteditable="${!task.locked}" class="editable" onblur="updateTask('${task.id}', 'title', this.innerText)">${task.title}</h3>
                    <p contenteditable="${!task.locked}" class="editable" onblur="updateTask('${task.id}', 'desc', this.innerText)">${task.desc}</p>
                    <div class="card-footer">
                        <div class="time-info"><i class="fa-regular fa-clock"></i> ${formatDate(task.date)}</div>
                        <div class="actions">
                            <button class="action-btn ${task.locked ? 'active-lock' : ''}" onclick="toggleLock('${task.id}')">
                                <i class="fa-solid fa-${task.locked ? 'lock' : 'lock-open'}"></i>
                            </button>
                            <button class="action-btn del" onclick="deleteTask('${task.id}')">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                        </div>
                    </div>
                `;
                grid.appendChild(div);
            });
        }

        // Sistema de Drag and Drop
        function allowDrop(ev) { ev.preventDefault(); }
        function drag(ev) { ev.dataTransfer.setData("text", ev.target.id); }
        function drop(ev) {
            ev.preventDefault();
            let data = ev.dataTransfer.getData("text");
            let draggedIdx = database.findIndex(t => t.id === data);
            let target = ev.target.closest('.card-pro');
            
            if (target && target.id !== data) {
                let targetIdx = database.findIndex(t => t.id === target.id);
                const [removed] = database.splice(draggedIdx, 1);
                database.splice(targetIdx, 0, removed);
                saveAndRender();
            }
        }

        // Lembrete inteligente (10 min)
        function checkImminent(dateStr) {
            const taskTime = new Date(dateStr).getTime();
            const now = new Date().getTime();
            const diffMin = (taskTime - now) / 60000;
            return diffMin > 0 && diffMin <= 10;
        }

        function toggleLock(id) {
            const task = database.find(t => t.id === id);
            task.locked = !task.locked;
            saveAndRender();
        }

        function updateTask(id, field, value) {
            const task = database.find(t => t.id === id);
            if (!task.locked) {
                task[field] = value;
                localStorage.setItem('pro_agenda_db', JSON.stringify(database));
            }
        }

        function deleteTask(id) {
            const task = database.find(t => t.id === id);
            if (task.locked) return notify("Desbloqueie para deletar!");
            database = database.filter(t => t.id !== id);
            saveAndRender();
        }

        function formatDate(ds) {
            const d = new Date(ds);
            return d.toLocaleDateString('pt-BR', {day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit'});
        }

        function notify(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 3000);
        }

        // Loop de Monitoramento Real-time
        setInterval(() => {
            const agora = new Date();
            document.getElementById('relogio').innerText = agora.toLocaleTimeString('pt-BR');
            
            database.forEach(t => {
                const taskTime = new Date(t.date).getTime();
                const agoraTime = agora.getTime();
                const diffMin = (taskTime - agoraTime) / 60000;

                // Notificar faltando exatamente 10 min
                if (diffMin <= 10 && diffMin > 9.9 && !notifiedTasks.has(t.id)) {
                    notify(`⚠️ LEMBRETE: ${t.title} em 10 minutos!`);
                    document.getElementById('alertSound').play();
                    notifiedTasks.add(t.id);
                    saveAndRender(); // Ativa o brilho no card
                }
            });
        }, 1000);

        saveAndRender();
    </script>
</body>
</html>
