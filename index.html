<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Planejer | Cloud OS</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --bg: #020205;
            --surface: rgba(18, 18, 24, 0.98);
            --primary: #00f2ff;
            --text-dim: #9494a3;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg); color: #fff; min-height: 100vh; overflow-x: hidden; }

        /* Login Screen */
        #auth-container {
            position: fixed; inset: 0; background: var(--bg); z-index: 9999;
            display: flex; align-items: center; justify-content: center; padding: 20px;
        }
        .auth-card {
            background: var(--surface); width: 100%; max-width: 400px;
            padding: 40px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.1);
            text-align: center;
        }
        .auth-input { 
            width: 100%; padding: 15px; margin-bottom: 12px; border-radius: 12px;
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: white; outline: none;
        }
        .btn-auth {
            width: 100%; padding: 15px; border-radius: 12px; background: var(--primary);
            border: none; font-weight: 800; cursor: pointer;
        }

        /* App Screen */
        #app-container { display: none; padding: 15px; max-width: 1200px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 20px 0; }
        
        .creator-panel {
            background: var(--surface); border-radius: 25px; padding: 20px; 
            margin-bottom: 30px; border: 1px solid rgba(255,255,255,0.08);
        }

        .board { display: flex; gap: 15px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 20px; }
        .column { background: rgba(255,255,255,0.02); border-radius: 25px; padding: 15px; min-width: 85vw; scroll-snap-align: center; min-height: 450px; }
        .col-title { color: var(--primary); font-weight: 800; font-size: 0.8rem; letter-spacing: 1px; margin-bottom: 20px; text-transform: uppercase; }

        .card { 
            background: var(--surface); border-radius: 20px; padding: 18px; 
            margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.05); 
            position: relative; animation: fadeIn 0.4s ease;
        }
        .card::before { content: ''; position: absolute; left: 0; top: 0; height: 100%; width: 5px; background: var(--primary); border-radius: 20px 0 0 20px; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } }
        
        @media (min-width: 1024px) {
            .column { min-width: 32%; }
        }
    </style>
</head>
<body>

    <div id="auth-container">
        <div class="auth-card" id="login-form">
            <h2 style="margin-bottom: 20px;">Planejer</h2>
            <input type="email" id="email" class="auth-input" placeholder="E-mail">
            <input type="password" id="password" class="auth-input" placeholder="Senha">
            <button class="btn-auth" onclick="handleAuth()">Entrar</button>
            <p style="margin-top: 20px; font-size: 0.8rem; color: var(--text-dim); cursor: pointer;" onclick="toggleAuth()">Criar nova conta</p>
        </div>
        <div class="auth-card" id="register-form" style="display: none;">
            <h2 style="margin-bottom: 20px;">Nova Conta</h2>
            <input type="text" id="reg-nome" class="auth-input" placeholder="Nome Completo">
            <input type="text" id="reg-apelido" class="auth-input" placeholder="Apelido">
            <input type="email" id="reg-email" class="auth-input" placeholder="E-mail">
            <input type="password" id="reg-password" class="auth-input" placeholder="Senha">
            <button class="btn-auth" onclick="handleRegister()">Cadastrar</button>
            <p style="margin-top: 20px; font-size: 0.8rem; color: var(--text-dim); cursor: pointer;" onclick="toggleAuth()">Voltar ao Login</p>
        </div>
    </div>

    <div id="app-container">
        <header>
            <div>Olá, <span id="user-display-name" style="color: var(--primary); font-weight: 700;">...</span></div>
            <button onclick="logout()" style="background:none; border:none; color: #ff4444; font-size: 1.2rem;"><i class="fa-solid fa-power-off"></i></button>
        </header>

        <div class="creator-panel">
            <input type="text" id="taskTitle" placeholder="Título da tarefa" class="auth-input">
            <textarea id="taskDesc" placeholder="Descrição rápida..." class="auth-input" style="height: 80px; resize: none;"></textarea>
            <button class="btn-auth" onclick="addTask()">Salvar no Banco Cloud</button>
        </div>

        <div class="board">
            <div class="column" id="col-hoje"><div class="col-title">Hoje</div></div>
            <div class="column" id="col-feito"><div class="col-title">Concluído</div></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, addDoc, query, where, onSnapshot, deleteDoc } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCOeI8GlFZ6vj8yGML3AhUkNIFpQFPJ-kQ",
            authDomain: "planejer.firebaseapp.com",
            projectId: "planejer",
            storageBucket: "planejer.firebasestorage.app",
            messagingSenderId: "338141836587",
            appId: "1:338141836587:web:1a6ab2bac7f8ac9dc6416e"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Funções globais para o HTML
        window.toggleAuth = () => {
            const login = document.getElementById('login-form');
            const reg = document.getElementById('register-form');
            login.style.display = login.style.display === 'none' ? 'block' : 'none';
            reg.style.display = reg.style.display === 'none' ? 'block' : 'none';
        }

        window.handleRegister = async () => {
            const nome = document.getElementById('reg-nome').value;
            const apelido = document.getElementById('reg-apelido').value;
            const email = document.getElementById('reg-email').value;
            const pass = document.getElementById('reg-password').value;

            try {
                const res = await createUserWithEmailAndPassword(auth, email, pass);
                await setDoc(doc(db, "users", res.user.uid), { nome, apelido, email });
            } catch (e) { alert("Erro ao cadastrar: " + e.message); }
        }

        window.handleAuth = () => {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            signInWithEmailAndPassword(auth, email, pass).catch(e => alert("Erro: " + e.message));
        }

        window.logout = () => signOut(auth);

        window.addTask = async () => {
            const title = document.getElementById('taskTitle').value;
            const desc = document.getElementById('taskDesc').value;
            if(!title) return;

            await addDoc(collection(db, "tasks"), {
                uid: auth.currentUser.uid,
                title, desc,
                column: 'col-hoje',
                createdAt: Date.now()
            });
            document.getElementById('taskTitle').value = '';
            document.getElementById('taskDesc').value = '';
        }

        window.deleteTask = async (id) => {
            await deleteDoc(doc(db, "tasks", id));
        }

        // Monitoramento de Estado
        onAuthStateChanged(auth, async (user) => {
            const authDiv = document.getElementById('auth-container');
            const appDiv = document.getElementById('app-container');

            if (user) {
                authDiv.style.display = 'none';
                appDiv.style.display = 'block';
                const userSnap = await getDoc(doc(db, "users", user.uid));
                document.getElementById('user-display-name').innerText = userSnap.data()?.apelido || "Usuário";
                
                // Escuta as tarefas em tempo real
                const q = query(collection(db, "tasks"), where("uid", "==", user.uid));
                onSnapshot(q, (snap) => {
                    renderTasks(snap);
                });
            } else {
                authDiv.style.display = 'flex';
                appDiv.style.display = 'none';
            }
        });

        function renderTasks(snapshot) {
            document.getElementById('col-hoje').innerHTML = '<div class="col-title">Hoje</div>';
            document.getElementById('col-feito').innerHTML = '<div class="col-title">Concluído</div>';

            snapshot.forEach(doc => {
                const t = doc.data();
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <h3>${t.title}</h3>
                    <p style="color:var(--text-dim); font-size:0.85rem; margin-top:5px;">${t.desc}</p>
                    <div style="margin-top:10px; display:flex; justify-content:flex-end;">
                        <i class="fa-solid fa-trash-can" style="color:#ff4444; cursor:pointer" onclick="deleteTask('${doc.id}')"></i>
                    </div>
                `;
                document.getElementById(t.column).appendChild(card);
            });
        }
    </script>
</body>
</html>
