<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agenda Pro Max — Apple × Notion</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0b0b0f;
  --surface:rgba(255,255,255,.06);
  --glass:rgba(255,255,255,.12);
  --border:rgba(255,255,255,.15);
  --accent:#0affff;
  --danger:#ff5c5c;
  --blur:blur(20px);

  --col-none:rgba(255,255,255,0.04);
  --col-blue:#0a84ff;
  --col-green:#30d158;
  --col-yellow:#ffd60a;
  --col-red:#ff453a;
}

/* RESET */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Inter',sans-serif;
}

/* BODY */
body{
  background:
    radial-gradient(circle at 30% -10%,#1a1a3a,#050507),
    radial-gradient(circle at 80% 120%,#002f30,#050507);
  color:#f1f1f1;
  min-height:100vh;
  padding:16px;
}

/* CONTAINER */
.container{
  max-width:1200px;
  margin:auto;
}

/* HEADER */
header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
  gap:12px;
}

header h1{
  font-size:1.6rem;
  font-weight:700;
  letter-spacing:-1px;
  background:linear-gradient(90deg,#fff,var(--accent));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

#clock{
  font-size:1rem;
  opacity:.8;
  white-space:nowrap;
}

/* COMMAND BAR */
.command{
  background:var(--surface);
  backdrop-filter:var(--blur);
  border:1px solid var(--border);
  border-radius:20px;
  padding:16px;
  display:grid;
  grid-template-columns:1.5fr 1.3fr auto;
  gap:10px;
  box-shadow:0 18px 40px rgba(0,0,0,.6);
  animation:slideDown .7s cubic-bezier(.2,.8,.2,1);
}

@keyframes slideDown{
  from{opacity:0;transform:translateY(-20px) scale(.98)}
  to{opacity:1;transform:translateY(0) scale(1)}
}

input{
  background:transparent;
  border:1px solid var(--border);
  padding:12px;
  border-radius:14px;
  color:white;
  outline:none;
  font-size:.95rem;
  transition:border-color .2s, box-shadow .2s, background .2s;
}

input:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 1px rgba(10,255,255,.4);
  background:rgba(255,255,255,.02);
}

button{
  background:linear-gradient(135deg,var(--accent),#5fffff);
  border:none;
  border-radius:14px;
  padding:0 22px;
  font-weight:600;
  cursor:pointer;
  color:#000;
  transition:.25s cubic-bezier(.2,.8,.2,1);
  font-size:.9rem;
  height:42px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
}

button:hover{
  transform:translateY(-1px) scale(1.04);
  box-shadow:0 0 18px rgba(0,255,255,.6);
}

button:active{
  transform:translateY(0) scale(.98);
  box-shadow:0 0 4px rgba(0,255,255,.4);
}

/* SEARCH */
.search{
  margin:20px 0 12px;
  display:flex;
  justify-content:center;
}

.search input{
  width:100%;
  max-width:520px;
  text-align:center;
  background:var(--surface);
  backdrop-filter:var(--blur);
  border-radius:999px;
}

/* SECTIONS */
.section{
  margin-top:14px;
}

.section-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin-bottom:12px;
}

.section h2{
  font-size:1.05rem;
  font-weight:600;
  opacity:.85;
}

/* COLOR FILTER BAR */
.color-filter{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:.8rem;
  opacity:.8;
  flex-wrap:wrap;
}

.color-pill{
  width:22px;
  height:22px;
  border-radius:999px;
  border:2px solid rgba(255,255,255,.25);
  cursor:pointer;
  position:relative;
  overflow:hidden;
  transition:.2s;
}

.color-pill-inner{
  width:100%;
  height:100%;
  border-radius:999px;
}

.color-pill[data-color="none"] .color-pill-inner{
  background:var(--col-none);
}

.color-pill[data-color="blue"] .color-pill-inner{
  background:var(--col-blue);
}

.color-pill[data-color="green"] .color-pill-inner{
  background:var(--col-green);
}

.color-pill[data-color="yellow"] .color-pill-inner{
  background:var(--col-yellow);
}

.color-pill[data-color="red"] .color-pill-inner{
  background:var(--col-red);
}

.color-pill.active{
  transform:translateY(-1px) scale(1.08);
  box-shadow:0 0 10px rgba(0,0,0,.7);
  border-color:#fff;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:18px;
}

/* CARD */
.card{
  background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.02));
  backdrop-filter:var(--blur);
  border:1px solid var(--border);
  border-radius:22px;
  padding:18px 16px 16px;
  transition:.35s cubic-bezier(.2,.8,.2,1);
  animation:fadeUp .45s both;
  transform-origin:center top;
  position:relative;
  overflow:hidden;
}

.card::before{
  content:"";
  position:absolute;
  inset:-40%;
  background:radial-gradient(circle at 0 0,rgba(10,255,255,.08),transparent 55%);
  opacity:0;
  transition:.4s;
  pointer-events:none;
}

@keyframes fadeUp{
  from{opacity:0;transform:translateY(14px) scale(.96)}
  to{opacity:1;transform:translateY(0) scale(1)}
}

.card:hover{
  transform:translateY(-4px) scale(1.03);
  box-shadow:0 26px 60px rgba(0,0,0,.8);
}

.card:hover::before{
  opacity:1;
}

.card.focus{
  outline:2px solid var(--accent);
  box-shadow:0 0 0 6px rgba(0,255,255,.18);
}

.card h3{
  font-size:1.02rem;
  margin-bottom:8px;
}

.card p{
  font-size:.9rem;
  opacity:.78;
  min-height:36px;
}

/* COLOR BAR INSIDE CARD */
.card-color-bar{
  display:flex;
  align-items:center;
  gap:6px;
  margin-bottom:8px;
}

.card-color-label{
  font-size:.75rem;
  opacity:.75;
}

.card-color-options{
  display:flex;
  gap:6px;
}

/* SMALL COLOR DOTS INSIDE CARD */
.card-color-dot{
  width:16px;
  height:16px;
  border-radius:999px;
  border:1px solid rgba(255,255,255,.35);
  cursor:pointer;
  position:relative;
  overflow:hidden;
  transition:.2s;
}

.card-color-dot-inner{
  width:100%;
  height:100%;
  border-radius:inherit;
}

.card-color-dot[data-color="none"] .card-color-dot-inner{
  background:var(--col-none);
}

.card-color-dot[data-color="blue"] .card-color-dot-inner{
  background:var(--col-blue);
}

.card-color-dot[data-color="green"] .card-color-dot-inner{
  background:var(--col-green);
}

.card-color-dot[data-color="yellow"] .card-color-dot-inner{
  background:var(--col-yellow);
}

.card-color-dot[data-color="red"] .card-color-dot-inner{
  background:var(--col-red);
}

.card-color-dot.active{
  transform:scale(1.12);
  box-shadow:0 0 8px rgba(0,0,0,.7);
  border-color:#fff;
}

/* FOOTER */
.footer{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:14px;
  font-size:.78rem;
  opacity:.82;
  gap:8px;
}

.actions{
  display:flex;
  gap:8px;
}

.actions button{
  padding:5px 11px;
  font-size:.78rem;
  height:auto;
}

/* TOAST */
#toast{
  position:fixed;
  top:18px;
  right:18px;
  background:var(--danger);
  padding:14px 22px;
  border-radius:20px;
  font-weight:600;
  display:none;
  animation:slideIn .4s ease;
  z-index:50;
}

@keyframes slideIn{
  from{transform:translateX(140%);opacity:0}
  to{transform:translateX(0);opacity:1}
}

/* MOBILE FIRST */
@media (max-width:768px){
  body{
    padding:12px;
  }

  header{
    flex-direction:column;
    align-items:flex-start;
  }

  header h1{
    font-size:1.4rem;
  }

  #clock{
    font-size:.9rem;
  }

  .command{
    grid-template-columns:1fr;
    padding:14px;
    border-radius:18px;
    gap:8px;
  }

  .command input,
  .command button{
    width:100%;
  }

  .actions{
    justify-content:flex-end;
  }
}

@media (max-width:480px){
  .grid{
    grid-template-columns:1fr;
    gap:14px;
  }

  .card{
    padding:14px 12px 12px;
    border-radius:18px;
  }

  .search input{
    max-width:100%;
    font-size:.9rem;
  }
}
</style>
</head>

<body>

<div id="toast"></div>

<div class="container">

<header>
  <h1>Agenda Pro Max</h1>
  <div id="clock"></div>
</header>

<div class="command">
  <input id="title" placeholder="Nova tarefa…" aria-label="Título da nova tarefa">
  <input type="datetime-local" id="date" aria-label="Data e hora da nova tarefa">
  <button id="add-btn">Adicionar</button>
</div>

<div class="search">
  <input id="search" placeholder="Buscar tarefas (⌘K / Ctrl+K)" oninput="render()">
</div>

<div class="section">
  <div class="section-header">
    <h2>📌 Suas tarefas</h2>
    <div class="color-filter">
      <span>Classificar por cor:</span>
      <div class="color-pill" data-color="all" id="filter-all">
        <div class="color-pill-inner" style="background:linear-gradient(135deg,var(--col-blue),var(--col-yellow));"></div>
      </div>
      <div class="color-pill" data-color="none">
        <div class="color-pill-inner"></div>
      </div>
      <div class="color-pill" data-color="blue">
        <div class="color-pill-inner"></div>
      </div>
      <div class="color-pill" data-color="green">
        <div class="color-pill-inner"></div>
      </div>
      <div class="color-pill" data-color="yellow">
        <div class="color-pill-inner"></div>
      </div>
      <div class="color-pill" data-color="red">
        <div class="color-pill-inner"></div>
      </div>
    </div>
  </div>
  <div class="grid" id="grid"></div>
</div>

</div>

<script>
let tasks = JSON.parse(localStorage.getItem("apple_notion_v2")) || [];
let currentColorFilter = "all";

function add(){
  const t = title.value.trim();
  const d = date.value;
  if (!t){
    return toast("Digite um título para a tarefa");
  }
  if (!d){
    return toast("Escolha uma data e hora");
  }
  tasks.push({
    id: Date.now(),
    title: t,
    desc: "Descrição da tarefa…",
    date: d,
    color: "none"
  });
  save();
  title.value = "";
  date.value = "";
  title.focus();
}

function save(){
  localStorage.setItem("apple_notion_v2", JSON.stringify(tasks));
  render();
}

function render(){
  const g = document.getElementById("grid");
  const s = document.getElementById("search").value.toLowerCase();
  g.innerHTML = "";

  tasks
    .slice()
    .sort((a,b)=> new Date(a.date) - new Date(b.date))
    .filter(t=> t.title.toLowerCase().includes(s))
    .filter(t=> currentColorFilter === "all" || t.color === currentColorFilter)
    .forEach(t=>{
      const c = document.createElement("div");
      c.className = "card";
      c.addEventListener("click", () => focusCard(c));

      const colorBar = document.createElement("div");
      colorBar.className = "card-color-bar";

      const colorLabel = document.createElement("span");
      colorLabel.className = "card-color-label";
      colorLabel.textContent = "Cor:";

      const colorOptions = document.createElement("div");
      colorOptions.className = "card-color-options";

      const colors = ["none","blue","green","yellow","red"];

      colors.forEach(col=>{
        const dot = document.createElement("div");
        dot.className = "card-color-dot";
        dot.dataset.color = col;

        const inner = document.createElement("div");
        inner.className = "card-color-dot-inner";

        dot.appendChild(inner);

        if (t.color === col){
          dot.classList.add("active");
        }

        dot.addEventListener("click", (e)=>{
          e.stopPropagation();
          setTaskColor(t.id, col);
        });

        colorOptions.appendChild(dot);
      });

      colorBar.appendChild(colorLabel);
      colorBar.appendChild(colorOptions);

      const h3 = document.createElement("h3");
      h3.contentEditable = "true";
      h3.textContent = t.title;
      h3.addEventListener("blur", () => edit(t.id,"title",h3.innerText));

      const p = document.createElement("p");
      p.contentEditable = "true";
      p.textContent = t.desc;
      p.addEventListener("blur", () => edit(t.id,"desc",p.innerText));

      const footer = document.createElement("div");
      footer.className = "footer";

      const spanDate = document.createElement("span");
      spanDate.textContent = new Date(t.date).toLocaleString("pt-BR");

      const actions = document.createElement("div");
      actions.className = "actions";

      const delBtn = document.createElement("button");
      delBtn.textContent = "Excluir";
      delBtn.addEventListener("click", (e)=>{
        e.stopPropagation();
        del(t.id);
      });

      actions.appendChild(delBtn);
      footer.appendChild(spanDate);
      footer.appendChild(actions);

      // aplicar um glow leve na borda de acordo com a cor
      if (t.color && t.color !== "none"){
        let colorMap = {
          blue:"var(--col-blue)",
          green:"var(--col-green)",
          yellow:"var(--col-yellow)",
          red:"var(--col-red)"
        };
        const col = colorMap[t.color] || "transparent";
        c.style.boxShadow = `0 0 0 1px rgba(255,255,255,.08), 0 0 18px ${col}33`;
      }

      c.appendChild(colorBar);
      c.appendChild(h3);
      c.appendChild(p);
      c.appendChild(footer);

      g.appendChild(c);
    });
}

function focusCard(el){
  document.querySelectorAll(".card").forEach(c=>c.classList.remove("focus"));
  el.classList.add("focus");
}

function edit(id,f,v){
  const task = tasks.find(t=>t.id===id);
  if (!task) return;
  task[f] = v;
  save();
}

function del(id){
  tasks = tasks.filter(t=>t.id!==id);
  save();
}

function toast(m){
  const t = document.getElementById("toast");
  t.innerText = m;
  t.style.display = "block";
  setTimeout(()=>t.style.display="none",2600);
}

// COLOR MANIPULATION
function setTaskColor(id,color){
  const task = tasks.find(t=>t.id===id);
  if (!task) return;
  task.color = color;
  save();
}

// FILTER BAR
function setupColorFilter(){
  const pills = document.querySelectorAll(".color-pill");
  pills.forEach(p=>{
    p.addEventListener("click", ()=>{
      const col = p.dataset.color;
      if (col === "all"){
        currentColorFilter = "all";
      }else{
        currentColorFilter = col;
      }
      pills.forEach(x=>x.classList.remove("active"));
      p.classList.add("active");
      render();
    });
  });
  // default: mostrar todas
  document.getElementById("filter-all").classList.add("active");
}

// Relógio
setInterval(()=>{
  clock.innerText = new Date().toLocaleTimeString("pt-BR");
},1000);

// Atalho ⌘K / Ctrl+K para foco na busca
document.addEventListener("keydown", e => {
  const isMac = navigator.platform.toUpperCase().indexOf("MAC") >= 0;
  if ((isMac && e.metaKey && e.key.toLowerCase()==="k") ||
      (!isMac && e.ctrlKey && e.key.toLowerCase()==="k")) {
    e.preventDefault();
    const search = document.getElementById("search");
    search.focus();
    search.select();
  }
});

// Enter no campo título dispara adicionar
document.getElementById("add-btn").addEventListener("click", add);
document.addEventListener("keydown", e=>{
  if (e.key === "Enter" && document.activeElement === title){
    add();
  }
});

// Foco inicial e render
window.addEventListener("load", () => {
  title.focus();
  setupColorFilter();
  render();
});
</script>

</body>
</html>
