<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Eazy Notes Ultra | Elite Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --bg: #020205;
            --surface: rgba(18, 18, 24, 0.9);
            --primary: #00f2ff;
            --secondary: #7000ff;
            --accent: #ff00c8;
            --glass: rgba(255, 255, 255, 0.03);
            --text-main: #ffffff;
            --text-dim: #9494a3;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }

        body {
            background: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            background-image: radial-gradient(circle at 50% -20%, #1a1a2e, #020205);
            overflow-x: hidden;
        }

        .container { padding: 20px; max-width: 1400px; margin: 0 auto; }

        /* Header Premium */
        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 0 40px;
        }
        .brand h1 { font-weight: 800; font-size: 2rem; letter-spacing: -1.5px; background: linear-gradient(90deg, #fff, var(--primary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        #clock { color: var(--primary); font-weight: 600; font-size: 1.1rem; text-shadow: 0 0 10px rgba(0, 242, 255, 0.3); }

        /* Painel de Criação Ultra Refinado */
        .creator-panel {
            background: var(--surface);
            border-radius: 32px; padding: 30px;
            border: 1px solid rgba(255,255,255,0.08);
            margin-bottom: 50px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.6);
            display: grid;
            grid-template-columns: 1fr 1fr auto;
            gap: 20px;
            align-items: end;
        }

        .input-box { display: flex; flex-direction: column; gap: 8px; }
        .input-box label { font-size: 0.75rem; font-weight: 700; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }
        
        input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 15px 20px;
            border-radius: 16px;
            color: #fff;
            outline: none;
            transition: 0.3s;
        }
        input:focus { border-color: var(--primary); background: rgba(255,255,255,0.08); }

        /* Seletor de Cores Customizado */
        .color-palette { display: flex; gap: 10px; padding: 5px 0; }
        .color-opt {
            width: 32px; height: 32px; border-radius: 50%;
            cursor: pointer; border: 3px solid transparent;
            transition: 0.3s;
        }
        .color-opt.selected { border-color: #fff; transform: scale(1.2); box-shadow: 0 0 15px currentColor; }

        .btn-add {
            background: var(--primary); color: #000;
            border: none; padding: 18px 35px; border-radius: 20px;
            font-weight: 800; cursor: pointer; transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            height: 55px;
        }
        .btn-add:hover { transform: scale(1.05); box-shadow: 0 0 30px rgba(0, 242, 255, 0.4); }

        /* Board Estilo Trello */
        .board {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 25px;
        }

        .column {
            background: rgba(255,255,255,0.02);
            border-radius: 30px; padding: 20px;
            border: 1px solid rgba(255,255,255,0.03);
            min-height: 600px;
            transition: 0.3s;
        }
        .column-header {
            font-size: 0.9rem; font-weight: 800; text-transform: uppercase;
            color: var(--primary); letter-spacing: 2px; margin-bottom: 25px;
            display: flex; align-items: center; gap: 10px;
        }

        /* Card Elite */
        .card {
            background: var(--surface);
            border-radius: 24px; padding: 22px;
            border: 1px solid rgba(255,255,255,0.05);
            margin-bottom: 20px;
            cursor: grab;
            transition: 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
            position: relative;
            overflow: hidden;
        }
        .card::before {
            content: ''; position: absolute; top:0; left:0; width:6px; height:100%;
            background: var(--c, var(--primary));
        }
        .card.dragging { opacity: 0.4; transform: scale(0.9); rotate: 2deg; }
        .card.locked { cursor: default; }

        .card h3 { font-size: 1.2rem; font-weight: 800; margin-bottom: 10px; color: #fff; }
        .card p { font-size: 0.9rem; color: var(--text-dim); line-height: 1.5; }

        .card-meta {
            margin-top: 20px; padding-top: 15px;
            border-top: 1px solid rgba(255,255,255,0.05);
            display: flex; justify-content: space-between; align-items: center;
        }
        .meta-time { font-size: 0.75rem; color: var(--primary); font-weight: 600; display: flex; align-items: center; gap: 5px; }

        .card-actions { display: flex; gap: 12px; }
        .act-btn { color: #555; cursor: pointer; transition: 0.3s; font-size: 1.1rem; }
        .act-btn:hover { color: #fff; }
        .act-btn.active { color: var(--primary); }

        @media (max-width: 900px) {
            .creator-panel { grid-template-columns: 1fr; }
            .board { overflow-x: auto; display: flex; }
            .column { min-width: 85vw; }
        }
    </style>
</head>
<body ondrop="drop(event)" ondragover="allowDrop(event)">

<div class="container">
    <header>
        <div class="brand"><h1>Eazy Notes Ultra</h1></div>
        <div id="clock">00:00:00</div>
    </header>

    <div class="creator-panel">
        <div class="input-box">
            <label>Título da Nota</label>
            <input type="text" id="taskTitle" placeholder="Ex: Reunião de Design">
        </div>
        
        <div class="input-box">
            <label>Data & Hora</label>
            <input type="datetime-local" id="taskDate">
        </div>

        <div class="input-box">
            <label>Prioridade (Cor)</label>
            <div class="color-palette" id="palette">
                <div class="color-opt selected" style="background: #00f2ff;" onclick="selectColor(this, '#00f2ff')"></div>
                <div class="color-opt" style="background: #7000ff;" onclick="selectColor(this, '#7000ff')"></div>
                <div class="color-opt" style="background: #ff00c8;" onclick="selectColor(this, '#ff00c8')"></div>
                <div class="color-opt" style="background: #00ff88;" onclick="selectColor(this, '#00ff88')"></div>
                <div class="color-opt" style="background: #ff9d00;" onclick="selectColor(this, '#ff9d00')"></div>
            </div>
        </div>

        <button class="btn-add" onclick="addTask()">Adicionar Task</button>
    </div>

    <div class="board">
        <div class="column" id="col-hoje" ondrop="drop(event)" ondragover="allowDrop(event)">
            <div class="column-header"><i class="fa-solid fa-bolt"></i> Hoje</div>
        </div>
        <div class="column" id="col-amanha" ondrop="drop(event)" ondragover="allowDrop(event)">
            <div class="column-header"><i class="fa-solid fa-calendar-day"></i> Amanhã</div>
        </div>
        <div class="column" id="col-foco" ondrop="drop(event)" ondragover="allowDrop(event)">
            <div class="column-header"><i class="fa-solid fa-star"></i> Prioridade Máxima</div>
        </div>
    </div>
</div>

<script>
    let tasks = JSON.parse(localStorage.getItem('eazy_ultra_db')) || [];
    let selectedColor = '#00f2ff';

    function selectColor(el, color) {
        document.querySelectorAll('.color-opt').forEach(opt => opt.classList.remove('selected'));
        el.classList.add('selected');
        selectedColor = color;
    }

    function addTask() {
        const title = document.getElementById('taskTitle').value;
        const date = document.getElementById('taskDate').value;

        if(!title || !date) return alert("Por favor, defina o título e o horário!");

        const newTask = {
            id: 'id-' + Date.now(),
            title: title,
            date: date,
            color: selectedColor,
            column: 'col-hoje',
            locked: false
        };

        tasks.push(newTask);
        saveAndRender();
        document.getElementById('taskTitle').value = '';
    }

    function saveAndRender() {
        localStorage.setItem('eazy_ultra_db', JSON.stringify(tasks));
        
        document.querySelectorAll('.column').forEach(col => {
            const header = col.querySelector('.column-header');
            col.innerHTML = '';
            col.appendChild(header);
        });

        tasks.forEach(task => {
            const card = document.createElement('div');
            card.className = `card ${task.locked ? 'locked' : ''}`;
            card.id = task.id;
            card.draggable = !task.locked;
            card.style.setProperty('--c', task.color);
            card.setAttribute('ondragstart', 'drag(event)');

            const dateObj = new Date(task.date);
            const formattedDate = dateObj.toLocaleDateString('pt-BR', {day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit'});

            card.innerHTML = `
                <h3>${task.title}</h3>
                <p>Status: Atividade programada para o sistema.</p>
                <div class="card-meta">
                    <div class="meta-time"><i class="fa-regular fa-clock"></i> ${formattedDate}</div>
                    <div class="card-actions">
                        <i class="fa-solid ${task.locked ? 'fa-lock' : 'fa-lock-open'} act-btn ${task.locked ? 'active' : ''}" 
                           onclick="toggleLock('${task.id}')"></i>
                        <i class="fa-solid fa-trash-can act-btn" onclick="removeTask('${task.id}')"></i>
                    </div>
                </div>
            `;
            document.getElementById(task.column).appendChild(card);
        });
    }

    // Drag & Drop
    function allowDrop(ev) { ev.preventDefault(); }
    function drag(ev) {
        ev.dataTransfer.setData("text", ev.target.id);
        ev.target.classList.add('dragging');
    }
    function drop(ev) {
        ev.preventDefault();
        const id = ev.dataTransfer.getData("text");
        const column = ev.target.closest('.column');
        if (column) {
            const task = tasks.find(t => t.id === id);
            if(!task.locked) {
                task.column = column.id;
                saveAndRender();
            }
        }
    }

    function toggleLock(id) {
        const task = tasks.find(t => t.id === id);
        task.locked = !task.locked;
        saveAndRender();
    }

    function removeTask(id) {
        const task = tasks.find(t => t.id === id);
        if(task.locked) return alert("Desbloqueie para deletar!");
        tasks = tasks.filter(t => t.id !== id);
        saveAndRender();
    }

    setInterval(() => {
        document.getElementById('clock').innerText = new Date().toLocaleTimeString('pt-BR');
    }, 1000);

    saveAndRender();
</script>
</body>
</html>
