<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agenda Pro Max Ultra 2026</title>

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
:root{
--bg:#050507;
--surface:#111116;
--accent:#00f2ff;
--danger:#ff3366;
--glass:rgba(255,255,255,.04);
}

*{margin:0;padding:0;box-sizing:border-box;font-family:'Outfit',sans-serif}

body{
background:radial-gradient(circle at 50% -20%,#1a1a2e,#050507);
color:#eee;
min-height:100vh;
padding:30px;
overflow-x:hidden;
}

/* Partículas */
body::before{
content:"";
position:fixed;
inset:0;
background:
radial-gradient(circle,rgba(0,242,255,.08) 1px,transparent 1px);
background-size:40px 40px;
animation:moveBg 40s linear infinite;
pointer-events:none;
}
@keyframes moveBg{
from{background-position:0 0}
to{background-position:400px 400px}
}

.container{max-width:1400px;margin:auto}

header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:25px;
}

.logo h1{
font-size:2rem;
background:linear-gradient(90deg,#fff,var(--accent));
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

#relogio{
font-size:1.3rem;
color:var(--accent);
letter-spacing:2px;
}

/* Barra */
.command-bar{
background:var(--surface);
border:1px solid rgba(255,255,255,.08);
border-radius:22px;
padding:20px;
display:grid;
grid-template-columns:2fr 1fr auto auto;
gap:15px;
margin-bottom:25px;
box-shadow:0 30px 60px rgba(0,0,0,.6);
animation:fadeDown .8s ease;
}

@keyframes fadeDown{
from{opacity:0;transform:translateY(-20px)}
to{opacity:1;transform:translateY(0)}
}

input,select{
background:var(--glass);
border:1px solid rgba(255,255,255,.1);
padding:12px;
border-radius:14px;
color:#fff;
outline:none;
}

.btn-add{
background:var(--accent);
color:#000;
border:none;
padding:0 30px;
border-radius:14px;
font-weight:700;
cursor:pointer;
transition:.4s;
}
.btn-add:hover{
transform:scale(1.08);
box-shadow:0 0 30px rgba(0,242,255,.6);
}

/* Filtros */
.filters{
display:flex;
gap:10px;
margin-bottom:20px;
}

.filter-btn{
background:var(--glass);
border:1px solid rgba(255,255,255,.08);
padding:8px 16px;
border-radius:20px;
cursor:pointer;
transition:.3s;
}
.filter-btn.active,
.filter-btn:hover{
background:var(--accent);
color:#000;
}

/* Grid */
.agenda-grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
gap:25px;
}

.card-pro{
background:linear-gradient(180deg,#14141a,#0d0d11);
border-radius:26px;
padding:24px;
border-top:4px solid var(--accent);
position:relative;
transform-style:preserve-3d;
transition:.5s cubic-bezier(.175,.885,.32,1.275);
animation:cardIn .6s ease both;
}

@keyframes cardIn{
from{opacity:0;transform:translateY(30px) scale(.9)}
to{opacity:1;transform:translateY(0) scale(1)}
}

.card-pro:hover{
transform:rotateX(6deg) rotateY(-6deg) scale(1.04);
box-shadow:0 30px 80px rgba(0,0,0,.7);
}

.card-pro.imminent{
animation:pulse 1.4s infinite;
border-color:var(--danger);
}

@keyframes pulse{
0%{box-shadow:0 0 0 0 rgba(255,51,102,.4)}
70%{box-shadow:0 0 0 20px rgba(255,51,102,0)}
100%{box-shadow:0 0 0 0 rgba(255,51,102,0)}
}

.card-pro h3{
font-size:1.3rem;
margin-bottom:10px;
}
.card-pro p{
font-size:.95rem;
color:#aaa;
min-height:45px;
}

.card-footer{
display:flex;
justify-content:space-between;
align-items:center;
margin-top:20px;
padding-top:15px;
border-top:1px solid rgba(255,255,255,.06);
}

.time-tag{
font-size:.8rem;
font-weight:600;
color:var(--accent);
}

.actions{
display:flex;
gap:12px;
}

.action-btn{
background:none;
border:none;
color:#666;
cursor:pointer;
transition:.3s;
font-size:1.1rem;
}
.action-btn:hover{color:#fff}

/* Toast */
#toast{
position:fixed;
top:20px;
right:20px;
background:var(--danger);
padding:16px 30px;
border-radius:18px;
font-weight:700;
display:none;
box-shadow:0 20px 50px rgba(255,51,102,.6);
animation:slide .5s ease;
z-index:9999;
}

@keyframes slide{
from{transform:translateX(120%)}
to{transform:translateX(0)}
}
</style>
</head>

<body>

<div id="toast"></div>

<div class="container">
<header>
<div class="logo"><h1>AGENDA PRO MAX</h1></div>
<div id="relogio"></div>
</header>

<div class="command-bar">
<input id="taskTitle" placeholder="Título da tarefa">
<input type="datetime-local" id="taskDate">
<button class="btn-add" onclick="addTask()">CRIAR</button>
<button class="btn-add" onclick="clearAll()">LIMPAR</button>
</div>

<div class="filters">
<div class="filter-btn active" onclick="setFilter('all')">Todas</div>
<div class="filter-btn" onclick="setFilter('today')">Hoje</div>
<div class="filter-btn" onclick="setFilter('late')">Atrasadas</div>
</div>

<div class="agenda-grid" id="agendaGrid"></div>
</div>

<audio id="notifSound">
<source src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3">
</audio>

<script>
let tasks=JSON.parse(localStorage.getItem("agenda_ultra"))||[];
let filter="all";

function addTask(){
const t=document.getElementById("taskTitle").value;
const d=document.getElementById("taskDate").value;
if(!t||!d) return toast("Preencha tudo!");

tasks.push({
id:Date.now(),
title:t,
date:d,
desc:"Clique para editar",
});

save();
}

function save(){
localStorage.setItem("agenda_ultra",JSON.stringify(tasks));
render();
}

function render(){
const g=document.getElementById("agendaGrid");
g.innerHTML="";
tasks.filter(checkFilter).forEach(t=>{
const diff=(new Date(t.date)-new Date())/60000;
const c=document.createElement("div");
c.className="card-pro"+(diff>0&&diff<10?" imminent":"");
c.innerHTML=`
<h3 contenteditable onblur="edit(${t.id},'title',this.innerText)">${t.title}</h3>
<p contenteditable onblur="edit(${t.id},'desc',this.innerText)">${t.desc}</p>
<div class="card-footer">
<div class="time-tag"><i class="fa-regular fa-clock"></i> ${new Date(t.date).toLocaleString("pt-BR")}</div>
<div class="actions">
<button class="action-btn" onclick="remove(${t.id})"><i class="fa fa-trash"></i></button>
</div>
</div>`;
g.appendChild(c);
});
}

function edit(id,f,v){
tasks.find(t=>t.id===id)[f]=v;
save();
}

function remove(id){
if(!confirm("Excluir tarefa?")) return;
tasks=tasks.filter(t=>t.id!==id);
save();
}

function clearAll(){
if(confirm("Apagar tudo?")){
tasks=[];
save();
}
}

function toast(msg){
const t=document.getElementById("toast");
t.innerText=msg;
t.style.display="block";
setTimeout(()=>t.style.display="none",4000);
}

function setFilter(f){
filter=f;
document.querySelectorAll(".filter-btn").forEach(b=>b.classList.remove("active"));
event.target.classList.add("active");
render();
}

function checkFilter(t){
const now=new Date();
const d=new Date(t.date);
if(filter==="today") return d.toDateString()===now.toDateString();
if(filter==="late") return d<now;
return true;
}

setInterval(()=>{
document.getElementById("relogio").innerText=new Date().toLocaleTimeString("pt-BR");
},1000);

render();
</script>
</body>
</html>
