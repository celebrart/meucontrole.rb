<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Planejer | Sistema de Gestão 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --bg: #020205;
            --surface: rgba(18, 18, 24, 0.9);
            --primary: #00f2ff;
            --secondary: #7000ff;
            --glass: rgba(255, 255, 255, 0.03);
            --text-main: #ffffff;
            --text-dim: #9494a3;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }

        body {
            background: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            background-image: radial-gradient(circle at 50% -20%, #1a1a2e, #020205);
            overflow-x: hidden;
        }

        .container { padding: 20px; max-width: 1400px; margin: 0 auto; }

        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 0 40px;
        }
        .brand h1 { font-weight: 800; font-size: 2.2rem; letter-spacing: -1.5px; background: linear-gradient(90deg, #fff, var(--primary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        #clock { color: var(--primary); font-weight: 600; font-size: 1.1rem; }

        /* Painel de Criação Planejer */
        .creator-panel {
            background: var(--surface);
            border-radius: 32px; padding: 30px;
            border: 1px solid rgba(255,255,255,0.08);
            margin-bottom: 50px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.6);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .input-box { display: flex; flex-direction: column; gap: 8px; }
        .full-width { grid-column: span 2; }
        
        label { font-size: 0.75rem; font-weight: 700; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }
        
        input, textarea {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 15px 20px;
            border-radius: 16px;
            color: #fff;
            outline: none;
            transition: 0.3s;
        }
        textarea { resize: none; height: 80px; }
        input:focus, textarea:focus { border-color: var(--primary); background: rgba(255,255,255,0.08); }

        /* Palette Premium */
        .color-palette { display: flex; gap: 12px; align-items: center; }
        .color-opt {
            width: 32px; height: 32px; border-radius: 50%;
            cursor: pointer; border: 3px solid transparent;
            transition: 0.3s;
        }
        .color-opt.selected { border-color: #fff; transform: scale(1.1); box-shadow: 0 0 15px currentColor; }

        .btn-add {
            grid-column: span 2;
            background: var(--primary); color: #000;
            border: none; padding: 18px; border-radius: 20px;
            font-weight: 800; cursor: pointer; transition: 0.3s;
            font-size: 1rem; text-transform: uppercase;
        }
        .btn-add:hover { transform: translateY(-3px); box-shadow: 0 10px 30px rgba(0, 242, 255, 0.3); }

        /* Kanban Board */
        .board {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 25px;
        }

        .column {
            background: rgba(255,255,255,0.01);
            border-radius: 30px; padding: 20px;
            border: 1px solid rgba(255,255,255,0.02);
            min-height: 500px;
        }
        .column-header {
            font-size: 0.9rem; font-weight: 800; text-transform: uppercase;
            color: var(--primary); letter-spacing: 2px; margin-bottom: 25px;
            display: flex; align-items: center; gap: 10px;
        }

        /* Card Premium */
        .card {
            background: var(--surface);
            border-radius: 24px; padding: 22px;
            border: 1px solid rgba(255,255,255,0.05);
            margin-bottom: 20px;
            cursor: grab;
            transition: 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            position: relative;
        }
        .card::before {
            content: ''; position: absolute; top:0; left:0; width:6px; height:100%;
            background: var(--c); border-radius: 24px 0 0 24px;
        }
        .card.dragging { opacity: 0.4; transform: scale(0.95); }
        
        .card h3 { font-size: 1.1rem; font-weight: 800; margin-bottom: 8px; color: #fff; }
        .card p { font-size: 0.85rem; color: var(--text-dim); line-height: 1.5; margin-bottom: 15px; }

        .card-meta {
            padding-top: 15px; border-top: 1px solid rgba(255,255,255,0.05);
            display: flex; justify-content: space-between; align-items: center;
        }
        .meta-time { font-size: 0.75rem; color: var(--primary); font-weight: 600; }
        .act-btn { color: #444; cursor: pointer; transition: 0.2s; font-size: 1.1rem; }
        .act-btn:hover { color: #fff; }
        .act-btn.active { color: var(--primary); }

    </style>
</head>
<body ondrop="drop(event)" ondragover="allowDrop(event)">

<div class="container">
    <header>
        <div class="brand"><h1>Planejer</h1></div>
        <div id="clock">00:00:00</div>
    </header>

    <div class="creator-panel">
        <div class="input-box">
            <label>Título</label>
            <input type="text" id="taskTitle" placeholder="O que vamos planejar?">
        </div>
        
        <div class="input-box">
            <label>Data & Hora</label>
            <input type="datetime-local" id="taskDate">
        </div>

        <div class="input-box full-width">
            <label>Descrição Detalhada</label>
            <textarea id="taskDesc" placeholder="Adicione os detalhes aqui..."></textarea>
        </div>

        <div class="input-box">
            <label>Prioridade</label>
            <div class="color-palette">
                <div class="color-opt selected" style="background: #00f2ff;" onclick="selectColor(this, '#00f2ff')"></div>
                <div class="color-opt" style="background: #7000ff;" onclick="selectColor(this, '#7000ff')"></div>
                <div class="color-opt" style="background: #ff00c8;" onclick="selectColor(this, '#ff00c8')"></div>
                <div class="color-opt" style="background: #00ff88;" onclick="selectColor(this, '#00ff88')"></div>
            </div>
        </div>

        <button class="btn-add" onclick="addTask()">Adicionar ao Planejer</button>
    </div>

    <div class="board">
        <div class="column" id="col-hoje" ondrop="drop(event)" ondragover="allowDrop(event)">
            <div class="column-header"><i class="fa-solid fa-calendar-check"></i> Hoje</div>
        </div>
        <div class="column" id="col-amanha" ondrop="drop(event)" ondragover="allowDrop(event)">
            <div class="column-header"><i class="fa-solid fa-clock"></i> Próximos</div>
        </div>
        <div class="column" id="col-concluido" ondrop="drop(event)" ondragover="allowDrop(event)">
            <div class="column-header"><i class="fa-solid fa-check-double"></i> Concluído</div>
        </div>
    </div>
</div>

<script>
    let tasks = JSON.parse(localStorage.getItem('planejer_db')) || [];
    let selectedColor = '#00f2ff';

    function selectColor(el, color) {
        document.querySelectorAll('.color-opt').forEach(opt => opt.classList.remove('selected'));
        el.classList.add('selected');
        selectedColor = color;
    }

    function addTask() {
        const title = document.getElementById('taskTitle').value;
        const date = document.getElementById('taskDate').value;
        const desc = document.getElementById('taskDesc').value;

        if(!title || !date) return alert("Título e Data são obrigatórios!");

        const newTask = {
            id: 'id-' + Date.now(),
            title: title,
            desc: desc || "Sem descrição adicional.",
            date: date,
            color: selectedColor,
            column: 'col-hoje',
            locked: false
        };

        tasks.push(newTask);
        saveAndRender();
        
        // Limpar campos
        document.getElementById('taskTitle').value = '';
        document.getElementById('taskDesc').value = '';
    }

    function saveAndRender() {
        localStorage.setItem('planejer_db', JSON.stringify(tasks));
        
        document.querySelectorAll('.column').forEach(col => {
            const header = col.querySelector('.column-header');
            col.innerHTML = '';
            col.appendChild(header);
        });

        tasks.forEach(task => {
            const card = document.createElement('div');
            card.className = `card ${task.locked ? 'locked' : ''}`;
            card.id = task.id;
            card.draggable = !task.locked;
            card.style.setProperty('--c', task.color);
            card.setAttribute('ondragstart', 'drag(event)');

            const dateStr = new Date(task.date).toLocaleString('pt-BR', {day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit'});

            card.innerHTML = `
                <h3>${task.title}</h3>
                <p>${task.desc}</p>
                <div class="card-meta">
                    <div class="meta-time">${dateStr}</div>
                    <div style="display:flex; gap:10px">
                        <i class="fa-solid ${task.locked ? 'fa-lock' : 'fa-lock-open'} act-btn ${task.locked ? 'active' : ''}" 
                           onclick="toggleLock('${task.id}')"></i>
                        <i class="fa-solid fa-trash act-btn" onclick="removeTask('${task.id}')"></i>
                    </div>
                </div>
            `;
            document.getElementById(task.column).appendChild(card);
        });
    }

    function drag(ev) { ev.dataTransfer.setData("text", ev.target.id); }
    function allowDrop(ev) { ev.preventDefault(); }
    function drop(ev) {
        ev.preventDefault();
        const id = ev.dataTransfer.getData("text");
        const column = ev.target.closest('.column');
        if (column) {
            const task = tasks.find(t => t.id === id);
            if(!task.locked) {
                task.column = column.id;
                saveAndRender();
            }
        }
    }

    function toggleLock(id) {
        const task = tasks.find(t => t.id === id);
        task.locked = !task.locked;
        saveAndRender();
    }

    function removeTask(id) {
        const task = tasks.find(t => t.id === id);
        if(task.locked) return alert("Desbloqueie para remover!");
        tasks = tasks.filter(t => t.id !== id);
        saveAndRender();
    }

    setInterval(() => {
        document.getElementById('clock').innerText = new Date().toLocaleTimeString('pt-BR');
    }, 1000);

    saveAndRender();
</script>
</body>
</html>
